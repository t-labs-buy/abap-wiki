name: Vault Graph Health

on:
  # Content changes, and every file this job runs. A checker whose own changes
  # do not trigger it is a checker nobody is checking: vault_model.py is shared
  # by both graph tools, and the prompt-suggest gate only earns its keep if it
  # runs when the suggester changes.
  # (Listed twice: GitHub Actions does not resolve YAML anchors.)
  push:
    paths:
      - "01-standards/**"
      - "02-workstreams/**"
      - "03-intelligence/**"
      - "04-internal/**"
      - ".github/scripts/vault_model.py"
      - ".github/scripts/graph-health.py"
      - ".github/scripts/question-gen.py"
      - ".github/scripts/prompt-suggest.py"
      - ".github/scripts/tests/prompt_suggest_test.py"
      - ".github/workflows/graph-health.yml"
  pull_request:
    paths:
      - "01-standards/**"
      - "02-workstreams/**"
      - "03-intelligence/**"
      - "04-internal/**"
      - ".github/scripts/vault_model.py"
      - ".github/scripts/graph-health.py"
      - ".github/scripts/question-gen.py"
      - ".github/scripts/prompt-suggest.py"
      - ".github/scripts/tests/prompt_suggest_test.py"
      - ".github/workflows/graph-health.yml"
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC, an hour after the ingest sweep
  workflow_dispatch:

concurrency:
  group: graph-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # read-only: this check never writes to the vault

jobs:
  graph-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No dependencies to install — the checker is standard library only.
      - name: Check wikilink graph
        # --strict fails the run on a hard violation (floating page, dead end,
        # missing or stale backlink). The baseline was clean when this was
        # added, so strict catches regressions from day one. Drop the flag if
        # it ever becomes noisier than it is useful.
        # The `|| status=$?` form matters: steps run under `bash -e`, so a bare
        # failing command would abort before the summary is ever written.
        run: |
          report="$RUNNER_TEMP/graph-health.md"
          status=0
          python3 .github/scripts/graph-health.py --out "$report" --strict || status=$?
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Candidate questions are prompts for the curator, not violations — this
      # step reports and never fails. Runs even when the graph check failed, so
      # a broken link does not hide the week's open gaps.
      - name: Generate candidate questions
        if: always()
        run: |
          report="$RUNNER_TEMP/questions.md"
          python3 .github/scripts/question-gen.py --out "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      # The starter prompts the skill shows are only worth anything if every
      # one of them is answerable. This gate asserts that against a synthetic
      # vault, so a regression fails here rather than in front of a reader.
      - name: Test prompt suggester
        if: always()
        run: python3 .github/scripts/tests/prompt_suggest_test.py

      # The reader-facing counterpart to the candidate questions: what the
      # vault CAN answer. The abap-wiki skill runs this same script against its
      # local clone, so a crash on real vault content surfaces here rather than
      # mid-question. Never fails the run — these are prompts, not violations.
      - name: Suggest starter prompts
        if: always()
        run: |
          report="$RUNNER_TEMP/prompts.md"
          python3 .github/scripts/prompt-suggest.py --top 12 --out "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
